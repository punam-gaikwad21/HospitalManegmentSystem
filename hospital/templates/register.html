<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f5f9;
            height: 100vh;
        }
        .register-card {
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .form-control {
            border-radius: 10px;
        }
        .btn-custom {
            border-radius: 10px;
            background-color: #2193b0;
            color: white;
        }
    </style>
</head>

<body>

<div class="d-flex justify-content-center align-items-center h-100">
    <div class="card p-4 register-card" style="width: 400px;">

        <h3 class="text-center mb-4">Patient Register</h3>

        {% if error %}
            <p class="text-danger text-center">{{ error }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control mb-3" placeholder="Enter username" required>

            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control mb-3" placeholder="Enter email" required>

            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control mb-3" placeholder="Enter password" required>

            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control mb-3" placeholder="Confirm password" required>

            <label class="form-label">Age</label>
            <input type="number" name="age" class="form-control mb-3" placeholder="Enter age" required>

            <button type="submit" class="btn btn-custom w-100">Register</button>
        </form>

        <p class="text-center mt-3">
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </div>
</div>

</body>
</html>
